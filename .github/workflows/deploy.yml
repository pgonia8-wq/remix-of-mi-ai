name: Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar paquetes Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Leer versión
        id: ver
        run: |
          V=$(node -p "require('./version.json').version")
          echo "build_name=${V}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Preparar proyecto Android
        run: VERSION_NAME="${{ steps.ver.outputs.build_name }}" bash scripts/android-prepare.sh

      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: bash scripts/verify-apk.sh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "MI-AI-debug-${{ steps.ver.outputs.build_name }}.apk"

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: MI-AI-${{ steps.ver.outputs.build_name }}
          path: MI-AI-debug-*.apk
          if-no-files-found: error
          retention-days: 15
