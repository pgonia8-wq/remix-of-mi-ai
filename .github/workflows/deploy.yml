name: Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION_CODE: ${{ github.run_number }}
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Comprobar Android SDK del runner
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "${ANDROID_HOME:?ANDROID_HOME no está definido}"
          ls -d "$ANDROID_HOME/platforms/android-36"*
          ls -d "$ANDROID_HOME/build-tools/36"*

      - name: Leer versión
        id: ver
        run: |
          V=$(node -p "require('./version.json').version")
          echo "build_name=${V}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias
        run: bun install --frozen-lockfile || bun install

      - name: Aceptar salida Nitro si no hay dist/client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/android-prepare.sh")
          s = p.read_text()
          old = """CAPACITOR=1 npx vite build
          test -f dist/client/index.html || { echo \"dist/client/index.html missing\"; exit 1; }"""
          new = r"""set +e
          CAPACITOR=1 bunx vite build
          VITE_RC=$?
          set -e
          if [ ! -f dist/client/index.html ]; then
            echo "Vite no escribió dist/client/index.html (exit=$VITE_RC). Buscando salida Nitro..."
            find dist .output -name 'index.html' -o -name '200.html' || true
            if [ -d .output/public ]; then
              mkdir -p dist/client
              cp -a .output/public/. dist/client/
              if [ ! -f dist/client/index.html ] && [ -f dist/client/200.html ]; then
                cp dist/client/200.html dist/client/index.html
              fi
            fi
          fi
          test -f dist/client/index.html || {
            echo "dist/client/index.html missing"
            ls -la dist dist/client .output .output/public 2>/dev/null || true
            exit 1
          }
          """
          old = "\n".join(line.strip() for line in old.splitlines())
          if old not in s.replace("\r\n", "\n"):
              s_norm = s.replace("\r\n", "\n")
              key = "CAPACITOR=1 npx vite build"
              if key not in s_norm:
                  raise SystemExit("no encontré CAPACITOR=1 npx vite build")
              raise SystemExit("el bloque de vite no coincide; no parcheo a ciegas")
          s = s.replace("\r\n", "\n").replace(old, new, 1)
          p.write_text(s)
          print("parche ok")
          PY

      - name: Preparar proyecto Android
        run: VERSION_NAME="${{ steps.ver.outputs.build_name }}" bash scripts/android-prepare.sh

      - name: Diagnóstico si falló la web
        if: failure()
        run: |
          echo "index.html encontrados:"
          find dist .output -name 'index.html' -o -name '200.html' || true
          echo "--- dist ---"; ls -la dist dist/client 2>/dev/null || true
          echo "--- .output ---"; ls -la .output .output/public 2>/dev/null || true

      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: bash scripts/verify-apk.sh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "MI-AI-debug-${{ steps.ver.outputs.build_name }}.apk"

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: MI-AI-${{ steps.ver.outputs.build_name }}
          path: MI-AI-debug-*.apk
          if-no-files-found: error
          retention-days: 15
