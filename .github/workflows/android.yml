name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3

      - name: Versión
        id: ver
        run: |
          V=$(node -p "require('./version.json').version")
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "build_name=$V-build.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Dependencias
        run: bun install --frozen-lockfile || bun install

      - name: Pruebas unitarias (aislamiento, memoria, API keys, exportación)
        run: bunx vitest run

      - name: Preparar proyecto Android
        run: VERSION_NAME=${{ steps.ver.outputs.build_name }} bash scripts/android-prepare.sh

      - name: Compilar APK Debug y Release sin firmar
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Verificar APK (ABIs arm64/armv7, SQLCipher, minSdk 30)
        run: bash scripts/verify-apk.sh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Pruebas en emulador Android 11 (API 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/emulator-test.sh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Subir informe de emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-report-${{ steps.ver.outputs.build_name }}
          path: emulator-report/

      - name: Firmar Release (solo si existe la clave)
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "signed=false" >> $GITHUB_OUTPUT; echo "Sin clave de firma: solo se publica Debug."; exit 0; fi
          echo "$KS_B64" | base64 -d > /tmp/release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/aligned.apk
          $BT/apksigner sign --ks /tmp/release.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out MI-AI-release.apk /tmp/aligned.apk
          $BT/apksigner verify MI-AI-release.apk
          rm -f /tmp/release.jks
          echo "signed=true" >> $GITHUB_OUTPUT

      - name: Renombrar APK Debug
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "MI-AI-debug-${{ steps.ver.outputs.build_name }}.apk"

      - name: Artefacto de la compilación
        uses: actions/upload-artifact@v4
        with:
          name: MI-AI-${{ steps.ver.outputs.build_name }}
          path: MI-AI-*.apk

      - name: Publicar "Última compilación de pruebas" (se reemplaza en cada commit)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete dev-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create dev-latest MI-AI-*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Última compilación de pruebas — ${{ steps.ver.outputs.build_name }}" \
            --notes "Compilación automática ${{ steps.ver.outputs.build_name }} del commit $GITHUB_SHA. Pruebas unitarias y de emulador Android 11 superadas. Se reemplaza en cada sincronización."

      - name: Publicar versión estable (solo si version.json cambió a una versión nueva)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG ya existe"; exit 0; fi
          FILES="MI-AI-debug-${{ steps.ver.outputs.build_name }}.apk"
          [ "${{ steps.sign.outputs.signed }}" = "true" ] && FILES="$FILES MI-AI-release.apk"
          gh release create "$TAG" $FILES --target "$GITHUB_SHA" --title "MI AI $TAG" \
            --notes "Versión estable $TAG (compilación ${{ github.run_number }})."
