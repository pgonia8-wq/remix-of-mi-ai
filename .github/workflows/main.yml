name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "index.html"
      - "server/**"
      - "e2e/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Instalar Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Instalar paquetes de Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Preparar proyecto Android
        shell: bash
        run: bash ./scripts/android-prepare.sh

      - name: Verificación
        shell: bash
        run: npm run verify

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-v1-${{ hashFiles('scripts/android-prepare.sh', 'capacitor.config.json', 'package-lock.json') }}
          restore-keys: android-gradle-v1-

      - name: Compilar APK Debug
        shell: bash
        run: ./android/gradlew assembleDebug -p android --no-daemon --stacktrace

      - name: Verificar que la APK existe
        shell: bash
        run: |
          ls -lh android/app/build/outputs/apk/debug/*.apk


      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mi-ai-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 15
